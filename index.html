<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamzin Hennessy</title>
<meta name="description" content="Tamzin Hennessy. Coming soon.">
<link rel="canonical" href="https://www.tamzinhennessy.co.uk/">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    background: #0f1f3d;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
  }

  .gold-rule {
    width: 40px;
    height: 1px;
    background: #c9a84c;
    margin: 0 auto 48px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #ffffff;
    margin-bottom: 24px;
  }

  p {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 48px;
  }

  .gold-rule-bottom {
    width: 40px;
    height: 1px;
    background: #c9a84c;
    margin: 0 auto;
  }

  footer {
    position: fixed;
    bottom: 32px;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.15);
  }
</style>
</head>
<body>

  <div class="gold-rule"></div>
  <h1>Tamzin Hennessy</h1>
  <p>Coming Soon</p>
  <div class="gold-rule-bottom"></div>

  <footer>© 2026 Tamzin Hennessy</footer>

</body>
</html>
